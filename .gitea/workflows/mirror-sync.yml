name: Mirror Sync
# Gitea resolves to a private address, so GitHub-side push hooks cannot reach
# it -- this repo is a PULL mirror and only learns about new commits when it
# syncs. Polling the mirror-sync API every 5 minutes halves the worst-case lag;
# the resulting push event then starts Routed CI immediately.
#
# Without this, Routed CI's own schedule still fires, but it checks out
# whatever stale commit the mirror last pulled, decides that SHA is already
# deployed, and exits -- so new work never ships.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger mirror sync
        env:
          MIRROR_SYNC_TOKEN: ${{ secrets.MIRROR_SYNC_TOKEN }}
        run: |
          if [ -z "${MIRROR_SYNC_TOKEN}" ]; then
            echo "MIRROR_SYNC_TOKEN secret not set; skipping (mirror syncs on its own interval)."
            exit 0
          fi
          curl -sf --max-time 30 -X POST \
            -H "Authorization: token ${MIRROR_SYNC_TOKEN}" \
            "https://gitea.lab.coolio.cloud/api/v1/repos/thedaviddias/ux-patterns-for-developers/mirror-sync" \
            && echo "Mirror sync triggered." \
            || echo "Mirror sync request failed; periodic sync remains the fallback."
