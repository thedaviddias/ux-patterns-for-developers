name: Routed CI

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routed-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and deploy through Gitea
    if: ${{ vars.BUILD_PROVIDER == 'gitea' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
      options: -v /var/lib/gitea-act-runner/pnpm-store:/pnpm-store -v /var/lib/gitea-act-runner/deployment-state:/ci-state
    timeout-minutes: 45
    env:
      PNPM_STORE_DIR: /pnpm-store
      CI_DEPLOYMENT_STATE_DIR: /ci-state
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check whether this commit needs deployment
        id: deployment-state
        run: bash scripts/ci/deployment-state.sh check

      - name: Enable pnpm
        if: ${{ steps.deployment-state.outputs.required == 'true' }}
        run: corepack enable

      - name: Setup Node.js
        if: ${{ steps.deployment-state.outputs.required == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Validate
        if: ${{ steps.deployment-state.outputs.required == 'true' }}
        run: bash scripts/ci/validate.sh

      - name: Build and deploy production to Vercel
        if: ${{ steps.deployment-state.outputs.required == 'true' && github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'gitea' }}
        run: bash scripts/ci/deploy-vercel.sh production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Record the deployed commit
        if: ${{ success() && steps.deployment-state.outputs.required == 'true' && github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'gitea' }}
        run: bash scripts/ci/deployment-state.sh mark
