# ONE OF TWO routed-ci workflows. The sibling lives at .github/workflows/routed-ci.yml.
# Only one runs: jobs are gated on the `BUILD_PROVIDER` repo variable,
# and this file is live only when BUILD_PROVIDER == "gitea".
# The inactive one skips silently and looks perfectly healthy in review, so a
# change made here may have no effect at all -- check which is active before
# editing, and consider whether the sibling needs the same change.
#
# Note the two have genuinely diverged (the Gitea one carries the
# deployment-state dedup guard and a mirror-poll schedule); they are not meant
# to be identical. scripts/ci/validate-deploy-workflows.mjs enforces the one
# invariant that must hold in both: full-history checkout for content dates.

name: Routed CI

on:
  push:
    branches: [main]
  schedule:
    # Fallback only; `push` (via Mirror Sync) is the real trigger. Offset from
    # mirror-sync's */5 so a run starts just after a sync, not alongside it.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routed-production-${{ github.ref }}
  # Never cancel a deploy in flight. With a scheduled trigger in the same
  # group, `true` means every tick kills the running build -- and this build
  # takes far longer than the interval, so it could never finish.
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Vercel configuration through Gitea
    if: ${{ vars.BUILD_PROVIDER == 'gitea' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      required: ${{ steps.deployment-state.outputs.required }}
    env:
      NPM_CONFIG_REGISTRY: http://172.17.0.1:4873
      PNPM_CONFIG_REGISTRY: http://172.17.0.1:4873
      COREPACK_NPM_REGISTRY: http://172.17.0.1:4873
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check whether this commit needs deployment
        id: deployment-state
        run: bash scripts/ci/deployment-state.sh check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Enable pnpm
        if: ${{ steps.deployment-state.outputs.required == 'true' }}
        run: corepack enable

      - name: Setup Node.js
        if: ${{ steps.deployment-state.outputs.required == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Pull production configuration from Vercel
        if: ${{ steps.deployment-state.outputs.required == 'true' && github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'gitea' }}
        run: bash scripts/ci/deploy-vercel.sh production pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Package Vercel configuration
        if: ${{ steps.deployment-state.outputs.required == 'true' && github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'gitea' }}
        run: node scripts/ci/vercel-artifact.mjs pack configuration
        env:
          CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}

      - name: Upload Vercel configuration
        if: ${{ steps.deployment-state.outputs.required == 'true' && github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'gitea' }}
        uses: https://github.com/ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4
        with:
          name: vercel-configuration
          path: ${{ runner.temp }}/vercel-configuration.tar.enc
          if-no-files-found: error
          retention-days: 1

  validate-and-build:
    name: Validate and build through Gitea
    if: ${{ needs.prepare.outputs.required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: prepare
    env:
      PNPM_STORE_DIR: /pnpm-store
      NPM_CONFIG_REGISTRY: http://172.17.0.1:4873
      PNPM_CONFIG_REGISTRY: http://172.17.0.1:4873
      COREPACK_NPM_REGISTRY: http://172.17.0.1:4873
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full commit history is required: scripts/generate-content-dates.mjs
          # derives each content file's dateModified from `git log`. At the
          # default depth of 1, git reports the single commit as adding every
          # file, so all content collapses onto one identical date -- the
          # generator fails the build rather than ship that.
          # blob:none keeps this cheap - .git is ~1.3GB, and reading commit
          # metadata + tree entries never needs the blobs themselves.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Enable pnpm
        if: ${{ needs.prepare.outputs.required == 'true' }}
        run: corepack enable

      - name: Setup Node.js
        if: ${{ needs.prepare.outputs.required == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Validate
        if: ${{ needs.prepare.outputs.required == 'true' }}
        run: bash scripts/ci/validate.sh

      - name: Download Vercel configuration
        if: ${{ needs.prepare.outputs.required == 'true' && github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'gitea' }}
        uses: https://github.com/ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7 # v4
        with:
          name: vercel-configuration
          path: ${{ runner.temp }}

      - name: Restore Vercel configuration
        if: ${{ needs.prepare.outputs.required == 'true' && github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'gitea' }}
        run: node scripts/ci/vercel-artifact.mjs unpack configuration
        env:
          CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}

      - name: Build production for Vercel
        if: ${{ needs.prepare.outputs.required == 'true' && github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'gitea' }}
        run: bash scripts/ci/deploy-vercel.sh production build
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Package prebuilt production artifact
        if: ${{ needs.prepare.outputs.required == 'true' && github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'gitea' }}
        run: node scripts/ci/vercel-artifact.mjs pack production
        env:
          CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}

      - name: Upload prebuilt production artifact
        if: ${{ needs.prepare.outputs.required == 'true' && github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'gitea' }}
        uses: https://github.com/ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4
        with:
          name: vercel-production
          path: ${{ runner.temp }}/vercel-production.tar.enc
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy through Gitea
    needs: [prepare, validate-and-build]
    if: ${{ needs.prepare.outputs.required == 'true' && github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'gitea' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_CONFIG_REGISTRY: http://172.17.0.1:4873
      PNPM_CONFIG_REGISTRY: http://172.17.0.1:4873
      COREPACK_NPM_REGISTRY: http://172.17.0.1:4873
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Download prebuilt production artifact
        uses: https://github.com/ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7 # v4
        with:
          name: vercel-production
          path: ${{ runner.temp }}

      - name: Restore prebuilt production artifact
        run: node scripts/ci/vercel-artifact.mjs unpack production
        env:
          CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}

      - name: Deploy production to Vercel
        run: bash scripts/ci/deploy-vercel.sh production deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
