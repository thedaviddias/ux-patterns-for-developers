# ONE OF TWO routed-ci workflows. The sibling lives at .github/workflows/routed-ci.yml.
# Only one runs: both jobs are gated on the `BUILD_PROVIDER` repo variable,
# and this file is live only when BUILD_PROVIDER == "gitea".
# The inactive one skips silently and looks perfectly healthy in review, so a
# change made here may have no effect at all -- check which is active before
# editing, and consider whether the sibling needs the same change.
#
# Note the two have genuinely diverged (the Gitea one carries the
# deployment-state dedup guard and a mirror-poll schedule); they are not meant
# to be identical. scripts/ci/validate-deploy-workflows.mjs enforces the one
# invariant that must hold in both: full-history checkout for content dates.

name: Routed CI

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routed-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: Validate and deploy through Gitea
    if: ${{ vars.BUILD_PROVIDER == 'gitea' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PNPM_STORE_DIR: /pnpm-store
      NPM_CONFIG_REGISTRY: http://172.17.0.1:4873
      PNPM_CONFIG_REGISTRY: http://172.17.0.1:4873
      COREPACK_NPM_REGISTRY: http://172.17.0.1:4873
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full commit history is required: scripts/generate-content-dates.mjs
          # derives each content file's dateModified from `git log`. At the
          # default depth of 1, git reports the single commit as adding every
          # file, so all content collapses onto one identical date -- the
          # generator fails the build rather than ship that.
          # blob:none keeps this cheap - .git is ~1.3GB, and reading commit
          # metadata + tree entries never needs the blobs themselves.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check whether this commit needs deployment
        id: deployment-state
        run: bash scripts/ci/deployment-state.sh check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Enable pnpm
        if: ${{ steps.deployment-state.outputs.required == 'true' }}
        run: corepack enable

      - name: Setup Node.js
        if: ${{ steps.deployment-state.outputs.required == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Validate
        if: ${{ steps.deployment-state.outputs.required == 'true' }}
        run: bash scripts/ci/validate.sh

      - name: Build and deploy production to Vercel
        if: ${{ steps.deployment-state.outputs.required == 'true' && github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'gitea' }}
        run: bash scripts/ci/deploy-vercel.sh production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
