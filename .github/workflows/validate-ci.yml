name: Validate CI changes

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .gitea/workflows/**
      - scripts/ci/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Check shell syntax
        run: bash -n scripts/ci/deploy-vercel.sh scripts/ci/deployment-state.sh scripts/ci/validate.sh

      - name: Validate workflows, regression tests and types
        run: bash scripts/ci/validate.sh

      - name: Build production without deployment credentials
        run: pnpm build
