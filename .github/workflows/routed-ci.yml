# ONE OF TWO routed-ci workflows. The sibling lives at .gitea/workflows/routed-ci.yml.
# Only one runs: jobs are gated on the `BUILD_PROVIDER` repo variable,
# and this file is live only when BUILD_PROVIDER == "github".
# The inactive one skips silently and looks perfectly healthy in review, so a
# change made here may have no effect at all -- check which is active before
# editing, and consider whether the sibling needs the same change.
#
# Note the two have genuinely diverged (the Gitea one carries the
# deployment-state dedup guard and a mirror-poll schedule); they are not meant
# to be identical. scripts/ci/validate-deploy-workflows.mjs enforces the one
# invariant that must hold in both: full-history checkout for content dates.

name: Routed CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routed-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Vercel configuration through GitHub
    if: ${{ vars.BUILD_PROVIDER == 'github' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Pull production configuration from Vercel
        if: ${{ github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'github' }}
        run: bash scripts/ci/deploy-vercel.sh production pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Package Vercel configuration
        if: ${{ github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'github' }}
        run: node scripts/ci/vercel-artifact.mjs pack configuration
        env:
          CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}

      - name: Upload Vercel configuration
        if: ${{ github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'github' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vercel-configuration
          path: ${{ runner.temp }}/vercel-configuration.tar.enc
          if-no-files-found: error
          retention-days: 1

  validate-and-build:
    name: Validate and build through GitHub
    if: ${{ vars.BUILD_PROVIDER == 'github' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: prepare
    env:
      PNPM_STORE_DIR: /pnpm-store
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full commit history is required: scripts/generate-content-dates.mjs
          # derives each content file's dateModified from `git log`. At the
          # default depth of 1 it finds nothing and every date comes back null.
          # blob:none keeps this cheap - .git is ~1.3GB, and reading commit
          # metadata + tree entries never needs the blobs themselves.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Validate
        run: bash scripts/ci/validate.sh

      - name: Download Vercel configuration
        if: ${{ github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'github' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vercel-configuration
          path: ${{ runner.temp }}

      - name: Restore Vercel configuration
        if: ${{ github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'github' }}
        run: node scripts/ci/vercel-artifact.mjs unpack configuration
        env:
          CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}

      - name: Build production for Vercel
        if: ${{ github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'github' }}
        run: bash scripts/ci/deploy-vercel.sh production build
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Package prebuilt production artifact
        if: ${{ github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'github' }}
        run: node scripts/ci/vercel-artifact.mjs pack production
        env:
          CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}

      - name: Upload prebuilt production artifact
        if: ${{ github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'github' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vercel-production
          path: ${{ runner.temp }}/vercel-production.tar.enc
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy through GitHub
    needs: [prepare, validate-and-build]
    if: ${{ github.ref == 'refs/heads/main' && vars.BUILD_PROVIDER == 'github' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Download prebuilt production artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vercel-production
          path: ${{ runner.temp }}

      - name: Restore prebuilt production artifact
        run: node scripts/ci/vercel-artifact.mjs unpack production
        env:
          CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}

      - name: Deploy production to Vercel
        run: bash scripts/ci/deploy-vercel.sh production deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
